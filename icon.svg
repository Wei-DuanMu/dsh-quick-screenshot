<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="dsh-quick-screenshot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#0b3d91"/>
    </linearGradient>
    <linearGradient id="flash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9dcff"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- viewfinder corners: the "aim at a window" idea -->
  <g stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.92">
    <path d="M13 23v-6a4 4 0 0 1 4-4h6"/>
    <path d="M51 23v-6a4 4 0 0 0-4-4h-6"/>
    <path d="M13 41v6a4 4 0 0 0 4 4h6"/>
    <path d="M51 41v6a4 4 0 0 1-4 4h-6"/>
  </g>

  <!-- camera body -->
  <rect x="20" y="25" width="24" height="17" rx="3.5" fill="url(#flash)"/>

  <!-- lens -->
  <circle cx="32" cy="33.5" r="5.4" fill="#0b3d91"/>
  <circle cx="32" cy="33.5" r="2.6" fill="#7fb0ff"/>

  <!-- flash bump -->
  <path d="M26 25l1.6-2.6h8.8L38 25z" fill="url(#flash)"/>
</svg>
